<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--border:#e4e7ec;--accent:#3157d5;--accent2:#eef2ff;--good:#067647;--goodbg:#ecfdf3;--warn:#b54708;--warnbg:#fffaeb;--bad:#b42318;--badbg:#fef3f2;--purple:#6941c6;--purplebg:#f4f3ff;--info:#175cd3;--infobg:#eff8ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}.headerActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.roleSwitch{display:flex;background:#f2f4f7;border-radius:11px;padding:3px}.roleBtn{border:0;background:transparent;border-radius:8px;padding:7px 10px;color:#475467;font-weight:650}.roleBtn.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px #10182818}
.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 67px)}aside{background:#fff;border-right:1px solid var(--border);padding:14px 10px}.nav{width:100%;border:0;background:transparent;padding:11px 12px;border-radius:10px;text-align:left;margin:3px 0;color:#344054}.nav.active{background:var(--accent2);color:var(--accent);font-weight:700}.sideLabel{padding:10px 12px 4px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
main{padding:22px;max-width:1550px;width:100%;margin:auto}h2{margin:0 0 5px}.note{background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:11px 13px;font-size:12px;margin:14px 0}.note.warn{background:var(--warnbg);border-color:#fedf89}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric,.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px}.metric b{font-size:25px;display:block;margin-top:5px}.metric small{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:#fff}.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px;font-weight:650}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{background:var(--badbg);color:var(--bad);border-color:#fecdca}.btn:disabled{opacity:.5;cursor:not-allowed}
.students{display:grid;grid-template-columns:1.65fr .8fr;gap:14px}.tablewrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:650px}table{border-collapse:collapse;width:100%;min-width:800px;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f9fafb;color:var(--muted);z-index:1}tr.click{cursor:pointer}tr.click:hover td{background:#fafbff}.studentcard{position:sticky;top:84px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.fact{background:#f9fafb;padding:9px;border-radius:9px}.fact small{display:block;color:var(--muted);margin-bottom:3px}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#f2f4f7;color:#344054}.admitido,.resuelta{background:var(--goodbg);color:var(--good)}.validado{background:var(--purplebg);color:var(--purple)}.baja{background:var(--badbg);color:var(--bad)}.pendiente,.nueva{background:var(--warnbg);color:var(--warn)}.revision{background:var(--infobg);color:var(--info)}.soporte{background:#f9f5ff;color:#6941c6}.ajuste{background:#fff6ed;color:#c4320a}
.tickets{display:grid;gap:10px}.ticket{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.tickethead{display:flex;justify-content:space-between;gap:10px}.ticketmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ticketActions{display:flex;gap:8px;align-items:end;margin-top:10px}.ticketActions select,.ticketActions input{max-width:220px}.barRows{display:grid;gap:9px}.barRow{display:grid;grid-template-columns:minmax(100px,170px) 1fr 48px;align-items:center;gap:9px;font-size:12px}.barTrack{height:10px;background:#eef0f4;border-radius:99px;overflow:hidden}.barFill{height:100%;background:var(--accent);border-radius:99px}.barFill.good{background:#12b76a}.barFill.warn{background:#f79009}.barFill.bad{background:#f04438}.listRows{display:grid;gap:8px}.listRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.uploadBox{border:1px dashed #98a2b3;border-radius:14px;padding:22px;text-align:center;background:#fff}.uploadBox input{max-width:520px;margin:12px auto 0}.uploadResult{margin-top:12px;text-align:left}.baseMeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.baseMeta .fact{text-align:center}
.modalback{position:fixed;inset:0;background:#0f172a70;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;padding:18px;width:min(650px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.campusHero{display:flex;justify-content:space-between;align-items:end;gap:14px}.campusChooser{min-width:250px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.students{grid-template-columns:1fr}.studentcard{position:static}}
@media(max-width:850px){header{align-items:flex-start}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.nav{width:auto;min-width:max-content}.sideLabel{display:none}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header{flex-direction:column}.metrics,.filters,.grid,.baseMeta{grid-template-columns:1fr}.full{grid-column:auto}.campusHero{align-items:stretch;flex-direction:column}.campusChooser{min-width:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">UTC</div><div><h1>UTC SEPTIEMBRE</h1><div class="sub">Gestor de seguimientos</div></div></div>
  <div class="headerActions">
    <div class="roleSwitch" aria-label="Cambiar vista"><button class="roleBtn" data-role="campus">👤 Usuario / Campus</button><button class="roleBtn" data-role="manager">⚙ Gestor</button></div>
    <button class="btn primary" id="newTicketTop">+ Seguimiento</button>
  </div>
</header>
<div class="layout">
<aside id="sidebar"></aside>
<main>
  <section id="campusHome" class="view hidden"></section>
  <section id="studentsView" class="view hidden"></section>
  <section id="campusTickets" class="view hidden"></section>
  <section id="managerDashboard" class="view hidden"></section>
  <section id="managerTickets" class="view hidden"></section>
  <section id="managerUpload" class="view hidden"></section>
</main>
</div>
<div id="modal" class="modalback hidden"><div class="modal">
  <h3 style="margin-top:0">Nuevo seguimiento</h3>
  <div class="grid">
    <div><label>Alumno / matrícula</label><input id="tm" placeholder="UTC-00001"></div>
    <div><label>Plantel</label><select id="tcampus"></select></div>
    <div><label>Tipo</label><select id="tt"><option>Cambio de ciclo</option><option>Validación</option><option>Admisión</option><option>Pago</option><option>Documentos</option><option>Accesos</option><option>Horario / materias</option><option>Otro</option></select></div>
    <div><label>Prioridad</label><select id="tpriority"><option>Normal</option><option>Alta</option><option>Crítica</option></select></div>
    <div class="full"><label>Descripción</label><textarea id="td" rows="4" placeholder="Describe qué necesitas revisar o modificar..."></textarea></div>
    <div><label>Solicitante</label><input id="ts" placeholder="Nombre o área"></div>
    <div id="managerStatusField" class="hidden"><label>Estatus inicial</label><select id="te"><option>NUEVA</option><option>EN REVISIÓN</option><option>AJUSTE CI</option><option>SOPORTE</option><option>RESUELTA</option></select></div>
  </div>
  <div class="actions"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Crear seguimiento</button></div>
</div></div>
<script src="dict.js"></script><script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script src="p4.js"></script><script src="p5.js"></script>
<script>
const D=window.UTC_DICT||{}, raw=atob(window.UTC_PACKED||''), RR=[];
for(let o=0;o<raw.length;o+=4){const v=(raw.charCodeAt(o))|(raw.charCodeAt(o+1)<<8)|(raw.charCodeAt(o+2)<<16)|(raw.charCodeAt(o+3)<<24);RR.push([v&31,(v>>>5)&63,(v>>>11)&3,(v>>>13)&3,(v>>>15)&15,(v>>>19)&3,(v>>>21)&7,(v>>>24)&3,(v>>>26)&1]);}
const publishedStudents=RR.map((r,idx)=>({i:`UTC-${String(idx+1).padStart(5,'0')}`,name:'',c:D.c[r[0]]||'',p:D.p[r[1]]||'',pe:D.pe[r[2]]||'',n:D.n[r[3]]||'',e:D.e[r[4]]||'',doc:D.do[r[5]]||'',pay:D.pa[r[6]]||'',z:D.z[r[7]]||'',ai:r[8]||0}));
let students=publishedStudents.slice();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('es-MX');
const statusClass=s=>{s=(s||'').toLowerCase();if(s.includes('resuelta')||s.includes('admitido'))return 'resuelta';if(s.includes('validado'))return 'validado';if(s.includes('baja'))return 'baja';if(s.includes('revision'))return 'revision';if(s.includes('soporte'))return 'soporte';if(s.includes('ajuste'))return 'ajuste';if(s.includes('nueva')||s.includes('pend'))return 'nueva';return ''};
const campuses=()=>[...new Set(students.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const params=new URLSearchParams(location.search);let role=params.get('view')==='manager'?'manager':'campus';let selectedCampus=params.get('campus')||campuses()[0]||'';let currentView='';let selected=null;let uploadMeta=null;

function buildSeedTickets(){const cs=campuses();const statuses=['NUEVA','EN REVISIÓN','EN REVISIÓN','AJUSTE CI','SOPORTE','RESUELTA','RESUELTA','RESUELTA'];const types=['Admisión','Validación','Cambio de ciclo','Documentos','Pago','Accesos','Horario / materias'];const priorities=['Normal','Normal','Normal','Alta'];let out=[];for(let i=0;i<64;i++){const c=cs[(i*7+3)%cs.length],s=statuses[i%statuses.length],type=types[(i*3)%types.length],pr=priorities[i%priorities.length],stu=students[(i*97)%students.length];const day=1+(i%8),hour=8+(i%9);out.push({id:1101+i,matricula:stu?.i||'',campus:c,tipo:type,descripcion:`Seguimiento de prueba para validar el flujo de ${type.toLowerCase()}.`,solicitante:`Equipo ${c}`,estatus:s,prioridad:pr,responsable:s==='RESUELTA'?'Onboarding':'',created:`2026-08-${String(day).padStart(2,'0')}T${String(hour).padStart(2,'0')}:00:00`,updated:`2026-08-${String(Math.min(8,day+1)).padStart(2,'0')}T${String(Math.min(17,hour+1)).padStart(2,'0')}:30:00`,demo:true});}return out;}
function getTickets(){try{const x=JSON.parse(localStorage.getItem('utc_sept_tickets_v3')||'null');if(Array.isArray(x)&&x.length)return x}catch{}const seed=buildSeedTickets();localStorage.setItem('utc_sept_tickets_v3',JSON.stringify(seed));return seed}
function setTickets(t){localStorage.setItem('utc_sept_tickets_v3',JSON.stringify(t))}
function todayRef(){return new Date('2026-08-08T16:42:00-06:00')}
function ageDays(t){return Math.max(0,(todayRef()-new Date(t.created))/(86400000))}
function countBy(arr,key){const o={};arr.forEach(x=>{const k=x[key]||'Sin dato';o[k]=(o[k]||0)+1});return o}
function setRole(r){role=r;const u=new URL(location.href);u.searchParams.set('view',r);history.replaceState({},'',u);$$('.roleBtn').forEach(b=>b.classList.toggle('active',b.dataset.role===r));$('#managerStatusField').classList.toggle('hidden',r!=='manager');renderSidebar();if(r==='manager')showView('managerDashboard');else showView('campusHome')}
function renderSidebar(){const items=role==='manager'?[['managerDashboard','▦ Dashboard'],['managerTickets','◎ Todos los seguimientos'],['studentsView','⌕ Consultar base'],['managerUpload','⇧ Cargar Salesforce']]:[['campusHome','⌂ Inicio'],['studentsView','⌕ Consultar alumno'],['campusTickets','◎ Mis seguimientos']];$('#sidebar').innerHTML=`<div class="sideLabel">${role==='manager'?'Gestión':'Campus'}</div>`+items.map(([v,l])=>`<button class="nav ${currentView===v?'active':''}" data-view="${v}">${l}</button>`).join('');$$('#sidebar .nav').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)))}
function showView(v){currentView=v;$$('.view').forEach(x=>x.classList.add('hidden'));$('#'+v).classList.remove('hidden');renderSidebar();if(v==='campusHome')renderCampusHome();if(v==='studentsView')renderStudentsView();if(v==='campusTickets')renderCampusTickets();if(v==='managerDashboard')renderManagerDashboard();if(v==='managerTickets')renderManagerTickets();if(v==='managerUpload')renderManagerUpload()}
function campusSelectHTML(id,value){return `<select id="${id}">${campuses().map(c=>`<option ${c===value?'selected':''}>${esc(c)}</option>`).join('')}</select>`}
function renderCampusHome(){const t=getTickets().filter(x=>x.campus===selectedCampus),open=t.filter(x=>x.estatus!=='RESUELTA').length,resolved=t.filter(x=>x.estatus==='RESUELTA').length;$('#campusHome').innerHTML=`<div class="campusHero"><div><h2>Portal de seguimiento</h2><div class="sub">Consulta alumnos y revisa las solicitudes de tu plantel.</div></div><div class="campusChooser"><label>Simular plantel</label>${campusSelectHTML('campusChooser',selectedCampus)}</div></div><div class="note"><b>Vista Usuario / Campus:</b> en producción el plantel vendrá definido por su usuario. En esta demo puedes cambiarlo para simular distintos campus.</div><div class="metrics"><div class="metric"><span class="sub">Seguimientos del plantel</span><b>${fmt(t.length)}</b></div><div class="metric"><span class="sub">En proceso</span><b>${fmt(open)}</b></div><div class="metric"><span class="sub">Resueltos</span><b>${fmt(resolved)}</b></div><div class="metric"><span class="sub">Alumnos en base</span><b>${fmt(students.filter(x=>x.c===selectedCampus).length)}</b></div></div><div class="two"><div class="panel"><h3 style="margin-top:0">Acciones rápidas</h3><button class="btn primary" id="homeSearch">Buscar alumno</button> <button class="btn" id="homeTicket">+ Levantar seguimiento</button></div><div class="panel"><h3 style="margin-top:0">Últimos movimientos</h3><div class="listRows">${t.slice(-5).reverse().map(x=>`<div class="listRow"><span><b>#${x.id}</b> · ${esc(x.tipo)}</span><span class="pill ${statusClass(x.estatus)}">${esc(x.estatus)}</span></div>`).join('')||'<div class="sub">Sin seguimientos.</div>'}</div></div></div>`;$('#campusChooser').addEventListener('change',e=>{selectedCampus=e.target.value;renderCampusHome()});$('#homeSearch').addEventListener('click',()=>showView('studentsView'));$('#homeTicket').addEventListener('click',()=>openTicket())}
function renderStudentsView(){const base=role==='campus'?students.filter(x=>x.c===selectedCampus):students;const cs=role==='campus'?[selectedCampus]:campuses();const statuses=[...new Set(base.map(x=>x.e).filter(Boolean))].sort();const periods=[...new Set(base.map(x=>x.pe).filter(Boolean))].sort();$('#studentsView').innerHTML=`<h2>${role==='manager'?'Consultar base Salesforce':'Consultar alumno'}</h2><div class="sub">${role==='manager'?'Consulta general de la base cargada.':'Sólo se muestran registros del plantel seleccionado.'}</div><div class="filters"><div><label>Buscar</label><input id="q" placeholder="Matrícula, programa, estatus..."></div><div><label>Plantel</label><select id="studentCampus" ${role==='campus'?'disabled':''}>${role==='manager'?'<option value="">Todos</option>':''}${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>Estatus</label><select id="studentStatus"><option value="">Todos</option>${statuses.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label>Periodo</label><select id="studentPeriod"><option value="">Todos</option>${periods.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="students"><div class="tablewrap"><table><thead><tr><th>${students===publishedStudents?'ID prueba':'Matrícula'}</th>${students.some(x=>x.name)?'<th>Alumno</th>':''}<th>Plantel</th><th>Programa</th><th>Periodo</th><th>Estatus</th></tr></thead><tbody id="studentBody"></tbody></table></div><div class="panel studentcard" id="studentCard"><div class="sub">Selecciona un registro para ver su ficha.</div></div></div>`;const campusSel=$('#studentCampus');if(role==='campus')campusSel.value=selectedCampus;const apply=()=>{let q=$('#q').value.toLowerCase().trim(),c=campusSel.value,s=$('#studentStatus').value,p=$('#studentPeriod').value;let f=base.filter(x=>(!c||x.c===c)&&(!s||x.e===s)&&(!p||x.pe===p)&&(!q||[x.i,x.name,x.c,x.p,x.pe,x.e,x.doc,x.pay,x.z].some(v=>String(v||'').toLowerCase().includes(q))));const show=f.slice(0,500),hasName=students.some(x=>x.name);$('#studentBody').innerHTML=show.map(x=>`<tr class="click" data-id="${esc(x.i)}"><td><b>${esc(x.i)}</b></td>${hasName?`<td>${esc(x.name)}</td>`:''}<td>${esc(x.c)}</td><td>${esc(x.p)}</td><td>${esc(x.pe)}</td><td><span class="pill ${statusClass(x.e)}">${esc(x.e)}</span></td></tr>`).join('')+(f.length>500?`<tr><td colspan="6" class="sub">Mostrando 500 de ${fmt(f.length)} resultados.</td></tr>`:'');$$('#studentBody tr.click').forEach(r=>r.addEventListener('click',()=>showStudentCard(r.dataset.id)))};['q','studentCampus','studentStatus','studentPeriod'].forEach(id=>$('#'+id)?.addEventListener(id==='q'?'input':'change',apply));apply()}
function showStudentCard(id){selected=students.find(x=>String(x.i)===String(id));if(!selected)return;const x=selected;$('#studentCard').innerHTML=`<h3 style="margin-top:0">${esc(x.name||x.i)}</h3>${x.name?`<div class="sub">${esc(x.i)}</div>`:'<div class="sub">Identidad protegida en la publicación pública</div>'}<div class="facts"><div class="fact"><small>Plantel</small>${esc(x.c)}</div><div class="fact"><small>Zona</small>${esc(x.z)}</div><div class="fact"><small>Periodo</small>${esc(x.pe)}</div><div class="fact"><small>Estatus</small><span class="pill ${statusClass(x.e)}">${esc(x.e)}</span></div><div class="fact"><small>Pago</small>${esc(x.pay)}</div><div class="fact"><small>Documentos</small>${esc(x.doc||'Sin dato')}</div><div class="fact"><small>Inducción</small>${x.ai==1?'Asistió':'Sin asistencia'}</div><div class="fact"><small>Nivel</small>${esc(x.n)}</div></div><div class="fact"><small>Programa</small>${esc(x.p)}</div><button class="btn primary" style="width:100%;margin-top:12px" id="ticketFor">+ Levantar seguimiento</button>`;$('#ticketFor').addEventListener('click',()=>openTicket(x.i,x.c))}
function ticketCard(x,manage=false){return `<div class="ticket" data-ticket="${x.id}"><div class="tickethead"><div><b>#${x.id} · ${esc(x.tipo)}</b><div class="sub">${esc(x.campus)} · ${esc(x.matricula)} · ${esc(x.solicitante)}</div></div><span class="pill ${statusClass(x.estatus)}">${esc(x.estatus)}</span></div><p>${esc(x.descripcion)}</p><div class="ticketmeta"><span class="pill">Prioridad: ${esc(x.prioridad||'Normal')}</span><span class="sub">Creado ${new Date(x.created).toLocaleDateString('es-MX')}</span>${x.responsable?`<span class="sub">Responsable: ${esc(x.responsable)}</span>`:''}</div>${manage?`<div class="ticketActions"><div><label>Estatus</label><select class="ticketStatus" data-id="${x.id}">${['NUEVA','EN REVISIÓN','AJUSTE CI','SOPORTE','RESUELTA'].map(s=>`<option ${s===x.estatus?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Responsable</label><input class="ticketOwner" data-id="${x.id}" value="${esc(x.responsable||'')}"></div><button class="btn saveTicketChange" data-id="${x.id}">Guardar</button></div>`:''}</div>`}
function renderCampusTickets(){const t=getTickets().filter(x=>x.campus===selectedCampus).slice().reverse();$('#campusTickets').innerHTML=`<div class="campusHero"><div><h2>Mis seguimientos</h2><div class="sub">Estatus de solicitudes del plantel ${esc(selectedCampus)}.</div></div><button class="btn primary" id="campusNew">+ Nuevo seguimiento</button></div><div class="tickets" style="margin-top:14px">${t.map(x=>ticketCard(x)).join('')||'<div class="panel empty">No hay seguimientos.</div>'}</div>`;$('#campusNew').addEventListener('click',()=>openTicket())}
function renderManagerDashboard(){const t=getTickets(),open=t.filter(x=>x.estatus!=='RESUELTA'),resolved=t.filter(x=>x.estatus==='RESUELTA'),waiting=t.filter(x=>['NUEVA','EN REVISIÓN','AJUSTE CI','SOPORTE'].includes(x.estatus));const avg=open.length?open.reduce((a,x)=>a+ageDays(x),0)/open.length:0;const byCampus=countBy(t,'campus'),byStatus=countBy(t,'estatus'),byType=countBy(t,'tipo');const topCampus=Object.entries(byCampus).sort((a,b)=>b[1]-a[1]).slice(0,10);const topMax=Math.max(1,...topCampus.map(x=>x[1]));const overdue=open.filter(x=>ageDays(x)>=3).sort((a,b)=>ageDays(b)-ageDays(a)).slice(0,7);const studentStatus=countBy(students,'e');$('#managerDashboard').innerHTML=`<h2>Dashboard de gestión</h2><div class="sub">Visión general de seguimientos y del último corte de Salesforce.</div><div class="note"><b>Demo funcional:</b> los tickets iniciales son simulados para mostrar el tablero; los que agregues o cambies se guardan en este navegador. La base publicada sí conserva la distribución operativa del archivo real.</div><div class="metrics"><div class="metric"><span class="sub">Tickets totales</span><b>${fmt(t.length)}</b><small>Todos los planteles</small></div><div class="metric"><span class="sub">En espera / proceso</span><b>${fmt(waiting.length)}</b><small>${Math.round(waiting.length/Math.max(1,t.length)*100)}% del total</small></div><div class="metric"><span class="sub">Resueltos</span><b>${fmt(resolved.length)}</b><small>${Math.round(resolved.length/Math.max(1,t.length)*100)}% de resolución</small></div><div class="metric"><span class="sub">Antigüedad promedio abiertos</span><b>${avg.toFixed(1)} d</b><small>${open.filter(x=>ageDays(x)>=3).length} con 3+ días</small></div></div><div class="three"><div class="panel"><h3 style="margin-top:0">Tickets por plantel</h3><div class="barRows">${topCampus.map(([k,v])=>`<div class="barRow"><span title="${esc(k)}">${esc(k)}</span><div class="barTrack"><div class="barFill" style="width:${v/topMax*100}%"></div></div><b>${v}</b></div>`).join('')}</div></div><div class="panel"><h3 style="margin-top:0">Por estatus</h3><div class="barRows">${Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barRow"><span>${esc(k)}</span><div class="barTrack"><div class="barFill ${k==='RESUELTA'?'good':k==='NUEVA'?'warn':''}" style="width:${v/Math.max(...Object.values(byStatus))*100}%"></div></div><b>${v}</b></div>`).join('')}</div></div><div class="panel"><h3 style="margin-top:0">Tipo de solicitud</h3><div class="listRows">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<div class="listRow"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div></div></div><div class="two" style="margin-top:14px"><div class="panel"><h3 style="margin-top:0">⚠ Requieren atención</h3><div class="sub" style="margin-bottom:8px">Abiertos con 3 días o más.</div><div class="listRows">${overdue.map(x=>`<div class="listRow"><span><b>#${x.id}</b> · ${esc(x.campus)} · ${esc(x.tipo)}</span><span>${ageDays(x).toFixed(0)} d</span></div>`).join('')||'<div class="sub">Sin casos vencidos.</div>'}</div></div><div class="panel"><h3 style="margin-top:0">Corte Salesforce</h3><div class="baseMeta"><div class="fact"><small>Registros</small><b>${fmt(students.length)}</b></div><div class="fact"><small>Admitidos</small><b>${fmt(studentStatus.Admitido||0)}</b></div><div class="fact"><small>Validados</small><b>${fmt(studentStatus.Validado||0)}</b></div></div><div class="sub" style="margin-top:12px">${uploadMeta?`Archivo cargado en esta sesión: ${esc(uploadMeta.name)} · ${esc(uploadMeta.when)}`:'Publicación basada en REPORTE UTC 08_08_2026.xlsx. Identidad enmascarada.'}</div></div></div>`}
function renderManagerTickets(){const t=getTickets().slice().reverse();$('#managerTickets').innerHTML=`<div class="campusHero"><div><h2>Todos los seguimientos</h2><div class="sub">Gestiona estatus y responsable.</div></div><button class="btn primary" id="managerNew">+ Nuevo seguimiento</button></div><div class="filters" style="grid-template-columns:1fr 1fr 1fr 1fr"><div><label>Buscar</label><input id="ticketQ" placeholder="ID, matrícula, tipo..."></div><div><label>Plantel</label><select id="ticketCampus"><option value="">Todos</option>${campuses().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>Estatus</label><select id="ticketStatusFilter"><option value="">Todos</option>${['NUEVA','EN REVISIÓN','AJUSTE CI','SOPORTE','RESUELTA'].map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Prioridad</label><select id="ticketPriority"><option value="">Todas</option><option>Normal</option><option>Alta</option><option>Crítica</option></select></div></div><div class="tickets" id="managerTicketList"></div>`;$('#managerNew').addEventListener('click',()=>openTicket());const apply=()=>{let q=$('#ticketQ').value.toLowerCase(),c=$('#ticketCampus').value,s=$('#ticketStatusFilter').value,p=$('#ticketPriority').value;let f=t.filter(x=>(!c||x.campus===c)&&(!s||x.estatus===s)&&(!p||x.prioridad===p)&&(!q||[x.id,x.matricula,x.campus,x.tipo,x.descripcion,x.solicitante].some(v=>String(v||'').toLowerCase().includes(q))));$('#managerTicketList').innerHTML=f.map(x=>ticketCard(x,true)).join('')||'<div class="panel empty">Sin resultados.</div>';$$('.saveTicketChange').forEach(b=>b.addEventListener('click',()=>saveTicketChange(Number(b.dataset.id))))};['ticketQ','ticketCampus','ticketStatusFilter','ticketPriority'].forEach(id=>$('#'+id).addEventListener(id==='ticketQ'?'input':'change',apply));apply()}
function saveTicketChange(id){let t=getTickets(),x=t.find(y=>Number(y.id)===id);if(!x)return;const card=$(`[data-ticket="${id}"]`);x.estatus=card.querySelector('.ticketStatus').value;x.responsable=card.querySelector('.ticketOwner').value.trim();x.updated=new Date().toISOString();setTickets(t);renderManagerTickets()}
function renderManagerUpload(){const status=countBy(students,'e');$('#managerUpload').innerHTML=`<h2>Cargar base Salesforce</h2><div class="sub">La estructura del archivo está fijada al formato que ya utilizas.</div><div class="note warn"><b>En esta demo:</b> el Excel se procesa únicamente en tu navegador y no se publica ni se guarda en GitHub. Al recargar la página se restaura la base pública enmascarada.</div><div class="uploadBox"><b>Selecciona REPORTE UTC .xlsx</b><div class="sub">Se leerá automáticamente la hoja <b>BASE TOTAL</b> y las columnas conocidas.</div><input id="excelFile" type="file" accept=".xlsx,.xls"><div id="uploadResult" class="uploadResult"></div></div><div class="baseMeta"><div class="fact"><small>Base actual en pantalla</small><b>${fmt(students.length)}</b></div><div class="fact"><small>Admitidos</small><b>${fmt(status.Admitido||0)}</b></div><div class="fact"><small>Validados</small><b>${fmt(status.Validado||0)}</b></div></div>`;$('#excelFile').addEventListener('change',loadExcel)}
async function loadExcel(ev){const file=ev.target.files?.[0];if(!file)return;const out=$('#uploadResult');out.innerHTML='<span class="sub">Procesando archivo…</span>';try{if(!window.XLSX)throw new Error('No se pudo cargar el lector de Excel.');const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets['BASE TOTAL'];if(!ws)throw new Error('No se encontró la hoja BASE TOTAL.');const rows=XLSX.utils.sheet_to_json(ws,{defval:''});if(!rows.length)throw new Error('La hoja no contiene registros.');const req=['Matrícula','Campus: Nombre de la cuenta','Programa 1: Curso: Nombre del curso','Periodo: Nombre de plazo','Estatus de Alumno'];const miss=req.filter(k=>!(k in rows[0]));if(miss.length)throw new Error('Faltan columnas esperadas: '+miss.join(', '));students=rows.map((r,idx)=>({i:String(r['Matrícula']||`SIN-${idx+1}`),name:String(r['Contacto: Nombre completo']||''),c:String(r['Campus: Nombre de la cuenta']||''),p:String(r['Programa 1: Curso: Nombre del curso']||''),pe:String(r['Periodo: Nombre de plazo']||''),n:String(r['Nivel']||''),e:String(r['Estatus de Alumno']||''),doc:String(r['Documentos']||''),pay:String(r['Estatus de pago']||''),z:String(r['ZONA']||''),ai:Number(r['Asistencia inducción']||0)}));uploadMeta={name:file.name,when:new Date().toLocaleString('es-MX')};selectedCampus=campuses()[0]||'';out.innerHTML=`<div class="note" style="margin-bottom:0"><b>✓ Base cargada correctamente</b><br>${fmt(students.length)} registros · ${fmt(campuses().length)} planteles.<br><span class="sub">Ahora puedes ir a Consultar base o Dashboard.</span></div>`;setTimeout(()=>renderManagerUpload(),900)}catch(e){out.innerHTML=`<div class="note warn" style="margin-bottom:0"><b>No se pudo cargar.</b><br>${esc(e.message)}</div>`}}
function openTicket(id='',campus=''){const x=students.find(s=>String(s.i)===String(id));$('#tm').value=id;$('#td').value='';$('#ts').value='';$('#te').value='NUEVA';$('#managerStatusField').classList.toggle('hidden',role!=='manager');$('#tcampus').innerHTML=campuses().map(c=>`<option>${esc(c)}</option>`).join('');$('#tcampus').value=campus||x?.c||selectedCampus||campuses()[0]||'';$('#modal').classList.remove('hidden')}
function closeTicket(){$('#modal').classList.add('hidden')}
function saveTicket(){let m=$('#tm').value.trim(),d=$('#td').value.trim(),c=$('#tcampus').value;if(!m||!d||!c)return alert('Captura alumno/matrícula, plantel y descripción.');let t=getTickets();const id=Math.max(1100,...t.map(x=>Number(x.id)||0))+1;t.push({id,matricula:m,campus:c,tipo:$('#tt').value,descripcion:d,solicitante:$('#ts').value||c,estatus:role==='manager'?$('#te').value:'NUEVA',prioridad:$('#tpriority').value,responsable:'',created:new Date().toISOString(),updated:new Date().toISOString(),demo:false});setTickets(t);closeTicket();if(role==='manager')showView('managerTickets');else{selectedCampus=c;showView('campusTickets')}}
$$('.roleBtn').forEach(b=>b.addEventListener('click',()=>setRole(b.dataset.role)));$('#newTicketTop').addEventListener('click',()=>openTicket(selected?.i||'',selected?.c||selectedCampus));$('#cancel').addEventListener('click',closeTicket);$('#save').addEventListener('click',saveTicket);setRole(role);
</script>
</body>
</html>
