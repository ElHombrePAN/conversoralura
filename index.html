<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTC SEPTIEMBRE · Gestor de seguimientos</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--border:#e4e7ec;--accent:#3157d5;--accent2:#eef2ff;--good:#067647;--goodbg:#ecfdf3;--warn:#b54708;--warnbg:#fffaeb;--bad:#b42318;--badbg:#fef3f2;--purple:#6941c6;--purplebg:#f4f3ff;--info:#175cd3;--infobg:#eff8ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}.headerActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.roleSwitch{display:flex;background:#f2f4f7;border-radius:11px;padding:3px}.roleBtn{border:0;background:transparent;border-radius:8px;padding:7px 10px;color:#475467;font-weight:650}.roleBtn.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px #10182818}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 67px)}aside{background:#fff;border-right:1px solid var(--border);padding:14px 10px}.nav{width:100%;border:0;background:transparent;padding:11px 12px;border-radius:10px;text-align:left;margin:3px 0;color:#344054}.nav.active{background:var(--accent2);color:var(--accent);font-weight:700}.sideLabel{padding:10px 12px 4px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
main{padding:22px;max-width:1700px;width:100%;margin:auto}h2{margin:0 0 5px}.note{background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:11px 13px;font-size:12px;margin:14px 0}.note.warn{background:var(--warnbg);border-color:#fedf89}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric,.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px}.metric b{font-size:25px;display:block;margin-top:5px}.metric small{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:#fff}.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px;font-weight:650}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.success{background:var(--good);border-color:var(--good);color:#fff}.danger{background:var(--badbg);color:var(--bad);border-color:#fecdca}.btn:disabled{opacity:.5;cursor:not-allowed}
.students{display:grid;grid-template-columns:1.65fr .8fr;gap:14px}.tablewrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:650px}table{border-collapse:collapse;width:100%;min-width:820px;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap}th{position:sticky;top:0;background:#f9fafb;color:var(--muted);z-index:2}tr.click{cursor:pointer}tr.click:hover td{background:#fafbff}.studentcard{position:sticky;top:84px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.fact{background:#f9fafb;padding:9px;border-radius:9px}.fact small{display:block;color:var(--muted);margin-bottom:3px}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#f2f4f7;color:#344054}.admitido,.resuelta,.recuperado{background:var(--goodbg);color:var(--good)}.validado{background:var(--purplebg);color:var(--purple)}.baja{background:var(--badbg);color:var(--bad)}.riesgo,.pendiente,.nueva{background:var(--warnbg);color:var(--warn)}.revision{background:var(--infobg);color:var(--info)}.soporte{background:#f9f5ff;color:#6941c6}.ajuste{background:#fff6ed;color:#c4320a}
.followups{display:grid;gap:10px}.followup{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.followhead{display:flex;justify-content:space-between;gap:10px}.followmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.followActions{display:flex;gap:8px;align-items:end;margin-top:10px;flex-wrap:wrap}.followActions select,.followActions input{max-width:220px}.barRows{display:grid;gap:9px}.barRow{display:grid;grid-template-columns:minmax(100px,170px) 1fr 48px;align-items:center;gap:9px;font-size:12px}.barTrack{height:10px;background:#eef0f4;border-radius:99px;overflow:hidden}.barFill{height:100%;background:var(--accent);border-radius:99px}.barFill.good{background:#12b76a}.barFill.warn{background:#f79009}.barFill.bad{background:#f04438}.listRows{display:grid;gap:8px}.listRow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.uploadBox{border:1px dashed #98a2b3;border-radius:14px;padding:22px;text-align:center;background:#fff}.uploadBox input{max-width:520px;margin:12px auto 0}.uploadResult{margin-top:12px;text-align:left}.baseMeta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.baseMeta .fact{text-align:center}
.modalback{position:fixed;inset:0;background:#0f172a70;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;padding:18px;width:min(610px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.quickTypes{display:flex;gap:8px;flex-wrap:wrap}.quickType{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px}.quickType.active{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.campusHero{display:flex;justify-content:space-between;align-items:end;gap:14px}.campusChooser{min-width:250px}.empty{padding:28px;text-align:center;color:var(--muted)}.rawToolbar{display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px;align-items:end;margin:14px 0}.rawTable{max-height:680px}.rawTable table{min-width:max-content}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}.recoveryRow{display:grid;grid-template-columns:1.2fr .8fr 1.1fr .7fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
@media(max-width:1100px){.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.students{grid-template-columns:1fr}.studentcard{position:static}.recoveryRow{grid-template-columns:1fr 1fr}}
@media(max-width:850px){header{align-items:flex-start}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}.nav{width:auto;min-width:max-content}.sideLabel{display:none}.filters,.rawToolbar{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header{flex-direction:column}.metrics,.filters,.grid,.baseMeta,.rawToolbar,.recoveryRow{grid-template-columns:1fr}.full{grid-column:auto}.campusHero{align-items:stretch;flex-direction:column}.campusChooser{min-width:0}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">UTC</div><div><h1>UTC SEPTIEMBRE</h1><div class="sub">Gestor de seguimientos</div></div></div>
  <div class="headerActions">
    <div class="roleSwitch"><button class="roleBtn" data-role="campus">👤 Campus</button><button class="roleBtn" data-role="commercial">💼 Comercial</button><button class="roleBtn" data-role="manager">⚙ Gestor</button></div>
    <button class="btn primary" id="newFollowTop">+ Seguimiento</button>
  </div>
</header>
<div class="layout"><aside id="sidebar"></aside><main>
<section id="campusHome" class="view hidden"></section><section id="studentsView" class="view hidden"></section><section id="campusFollowups" class="view hidden"></section>
<section id="commercialHome" class="view hidden"></section><section id="commercialPortfolio" class="view hidden"></section><section id="commercialFollowups" class="view hidden"></section>
<section id="managerDashboard" class="view hidden"></section><section id="managerFollowups" class="view hidden"></section><section id="managerData" class="view hidden"></section><section id="managerUpload" class="view hidden"></section>
</main></div>
<div id="modal" class="modalback hidden"><div class="modal"><h3 id="modalTitle" style="margin-top:0">Nuevo seguimiento</h3><div id="modalStudent" class="note hidden"></div><div class="grid">
<div id="manualMat"><label>Matrícula / ID</label><input id="fm" placeholder="Selecciona un alumno o captura matrícula"></div><div><label>Plantel</label><select id="fcampus"></select></div>
<div class="full"><label id="typeLabel">Motivo del seguimiento</label><div class="quickTypes" id="quickTypes"></div><input type="hidden" id="ftype"></div>
<div class="full"><label id="commentLabel">¿Qué necesitas revisar?</label><textarea id="fcomment" rows="3" placeholder="Escribe sólo lo necesario para atender el caso..."></textarea></div>
<div id="managerFields" class="full hidden"><div class="grid"><div><label>Estatus inicial</label><select id="fstatus"><option>NUEVA</option><option>EN REVISIÓN</option><option>AJUSTE CI</option><option>SOPORTE</option><option>RESUELTA</option></select></div><div><label>Responsable</label><input id="fowner" placeholder="Opcional"></div></div></div>
</div><div class="actions"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Crear seguimiento</button></div></div></div>
<script src="dict.js"></script><script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script src="p4.js"></script><script src="p5.js"></script>
<script src="v4a.js"></script><script src="v4b.js"></script><script src="v4c.js"></script><script src="v5.js"></script>
</body></html>
