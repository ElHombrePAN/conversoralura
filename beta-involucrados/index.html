<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTC SEPTIEMBRE · Gestor de seguimientos</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--text:#172033;--muted:#667085;--line:#dce1e9;--line2:#cbd2dc;--accent:#3157d5;--accentSoft:#eef2ff;--good:#067647;--goodBg:#ecfdf3;--warn:#b54708;--warnBg:#fffaeb;--bad:#b42318;--badBg:#fef3f2;--info:#175cd3;--infoBg:#eff8ff;--purple:#6941c6;--purpleBg:#f4f3ff;--rowH:35px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{height:62px;position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:850}.brand h1{margin:0;font-size:18px}.sub{font-size:11px;color:var(--muted)}.roleSwitch{display:flex;padding:3px;background:#f2f4f7;border-radius:10px}.roleBtn{border:0;background:transparent;border-radius:7px;padding:7px 10px;color:#475467;font-weight:650}.roleBtn.active{background:#fff;color:var(--accent);box-shadow:0 1px 3px #10182818}
.layout{display:grid;grid-template-columns:202px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{background:#fff;border-right:1px solid var(--line);padding:11px 8px}.sideLabel{padding:8px 10px 5px;font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.06em}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;margin:2px 0;border-radius:8px;color:#344054}.nav.active{background:var(--accentSoft);color:var(--accent);font-weight:750}main{min-width:0;padding:13px 14px 18px}h2{font-size:20px;margin:0 0 3px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}.meta{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:10px;color:#475467}
.btn{border:1px solid var(--line2);background:#fff;color:#344054;border-radius:7px;padding:7px 9px;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;border-radius:99px;padding:3px 7px;font-size:9px;font-weight:750;background:#f2f4f7;color:#344054}.pill.admitido,.pill.resuelta{background:var(--goodBg);color:var(--good)}.pill.validado{background:var(--purpleBg);color:var(--purple)}.pill.baja{background:var(--badBg);color:var(--bad)}.pill.riesgo,.pill.nueva{background:var(--warnBg);color:var(--warn)}.pill.revision{background:var(--infoBg);color:var(--info)}.pill.ajuste{background:#fff6ed;color:#c4320a}.pill.soporte{background:#f9f5ff;color:#6941c6}
.toolbar{display:grid;grid-template-columns:minmax(240px,2fr) minmax(135px,1fr) minmax(135px,1fr) minmax(115px,.8fr) 76px auto auto;gap:7px;align-items:end;margin:10px 0 8px}.toolbar label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.toolbar input,.toolbar select{width:100%;height:33px;padding:5px 7px;border:1px solid #cfd5df;border-radius:6px;background:#fff}
.pinBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:8px}.pinTitle{font-size:10px;font-weight:800;color:#667085;text-transform:uppercase;letter-spacing:.05em}.pinToggle{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;color:#475467}.pinToggle .switch{width:28px;height:16px;border-radius:99px;background:#d0d5dd;position:relative;transition:.16s}.pinToggle .switch:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;left:2px;top:2px;box-shadow:0 1px 2px #0002;transition:.16s}.pinToggle.on{border-color:#a8b8f0;background:#f7f9ff;color:#2445b8}.pinToggle.on .switch{background:var(--accent)}.pinToggle.on .switch:after{left:14px}.pinHint{font-size:10px;color:var(--muted);margin-left:auto}
.sheetShell{background:#fff;border:1px solid #cfd5df;border-radius:8px;overflow:hidden}.paneGrid{display:grid;min-width:0;background:#fff}.pane{min-width:0;background:#fff}.pane.left{border-right:2px solid #aab9df;box-shadow:5px 0 12px -12px #101828;z-index:3}.pane.right{border-left:2px solid #aab9df;box-shadow:-5px 0 12px -12px #101828;z-index:3}.pane.center{z-index:1}.headScroll{overflow:hidden}.bodyPane{height:calc(100vh - 280px);min-height:455px;overflow-y:auto;scrollbar-width:none}.bodyPane::-webkit-scrollbar{width:0;height:0}.bodyPane.center{overflow:auto;scrollbar-width:auto}.bodyPane.center::-webkit-scrollbar{width:11px;height:11px}.bodyPane.center::-webkit-scrollbar-thumb{background:#c4cad3;border-radius:8px;border:2px solid #fff}.bodyPane.center::-webkit-scrollbar-track{background:#f6f7f9}.headScroll.center{overflow:hidden}
.gridTable{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:10px}.gridTable th,.gridTable td{height:var(--rowH);padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gridTable tbody tr:nth-child(even) td{background:#fbfcfe}.gridTable tbody tr.hover td{background:#edf3ff!important}.gridTable th{font-weight:700;color:#344054}.gridTable .group th{height:24px;text-align:center;font-size:9px;letter-spacing:.04em;border-bottom:1px solid var(--line2)}.gridTable .cols th{height:40px;background:#f8f9fb;white-space:normal;line-height:1.12;text-align:left}.g-id{background:#edf3ff!important}.g-acad{background:#f4f1ff!important}.g-pay{background:#fff7e8!important}.g-status{background:#ecfdf3!important}.g-action{background:#e8efff!important;color:#2445b8!important}.rownum{color:#667085;text-align:center;background:#f4f5f7!important}.sfStatus .pill{vertical-align:middle}
.actionCell{background:#f8faff!important}.gridTable input,.gridTable select{width:100%;height:26px;border:1px solid #c9d0da;border-radius:5px;background:#fff;padding:2px 5px;font-size:10px;color:#344054}.gridTable input:focus,.gridTable select:focus{outline:2px solid #8eabff;outline-offset:-1px}.gridTable input[readonly]{background:#f6f7f9;color:#667085}.sendBtn{height:26px;padding:2px 6px;font-size:9px;border-radius:5px}.statusBox{display:flex;align-items:center;height:26px;white-space:nowrap}.requester{min-width:0}.adjustSelect[data-tone="general"]{background:#fff1e8;border-color:#ffd0b5}.adjustSelect[data-tone="warning"]{background:#fff7da;border-color:#f4d980}.adjustSelect[data-tone="green"]{background:#eefbe8;border-color:#b7e5a8}.adjustSelect[data-tone="blue"]{background:#eaf5ff;border-color:#acd5f5}.adjustSelect[data-tone="purple"]{background:#f4edff;border-color:#ccb8ee}.adjustSelect[data-tone="red"]{background:#fff0ef;border-color:#f2b6b2}.adjustSelect[data-tone="brown"]{background:#f9eee6;border-color:#d8b297}.adjustSelect[data-tone="teal"]{background:#e8f6f7;border-color:#acd7db}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.pagerActions{display:flex;gap:6px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px}.metric span{display:block;font-size:10px;color:var(--muted)}.metric b{display:block;font-size:23px;margin-top:4px}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:145px 1fr 38px;gap:8px;align-items:center;font-size:10px}.track{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.listRow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:10px}.followTable{width:100%;border-collapse:collapse;font-size:10px}.followTable th,.followTable td{padding:7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.followTable select,.followTable input{width:100%;border:1px solid var(--line2);border-radius:5px;padding:5px}.upload{border:1px dashed #98a2b3;background:#fff;border-radius:10px;padding:24px;text-align:center}.upload input{display:block;margin:12px auto;max-width:520px;width:100%}
@media(max-width:1180px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.sideLabel{display:none}.nav{width:auto;white-space:nowrap}.toolbar{grid-template-columns:2fr 1fr 1fr 1fr}.pinHint{width:100%;margin-left:0}.bodyPane{height:580px}.two{grid-template-columns:1fr}}@media(max-width:650px){header{height:auto;align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.bodyPane{height:470px}}
</style>
</head>

</body></html>
